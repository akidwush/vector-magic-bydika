[package]
name = "nexora-wasm"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
vtracer = { path = "../vendor/vtracer" }
flo_curves = "=0.8.0"
wasm-bindgen = "=0.2.126"
[profile.release]
opt-level = "s"
lto = true
[features]
experiments = []
# Research-only source target solver; activation blocked by exported geometry gate.
source_geometry = []

# Independently certified large-motion experiment; ordinary source_geometry is unchanged.
large_apex = ["source_geometry"]

# Opt-in cache prototype; mixed whole-trace timing prevents default activation.
runtime_cache = ["source_geometry"]

# Inclusive timers and deterministic counters, absent from production builds.
runtime_profile = ["large_apex", "runtime_cache"]

# Diagnostic A/B baseline: same fitter and guards, exact-area cache disabled.
runtime_uncached = ["runtime_profile"]

# Source-exact inverse scoring experiment; no global cache or geometry changes.
inverse_hotpath = ["source_geometry"]

# Stage J counters; implies existing uncached profiler, never a production default.
legacy_work = ["runtime_uncached", "vtracer/runtime_work"]

# Region-survival diagnostics and opt-in protection, independent of curve recovery.
thin_feature_research = ["vtracer/thin_feature_research"]

# Independent, opt-in source-verified Watershed/Mosaic region experiment.
watershed_region_research = ["vtracer/watershed_region_research"]
