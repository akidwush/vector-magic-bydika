name: Watershed region recovery research
on:
  push:
    branches: [feat/stage-1-7c-watershed-region-recovery]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [feat/stage-1-7c-watershed-region-recovery]
jobs:
  source-region-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: sudo apt-get update && sudo apt-get install -y inkscape
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/watershed-region-research.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watershed-region-raw-${{ github.sha }}
          path: |
            benchmark-results/stage17c/
            test-results/
            playwright-report/
          if-no-files-found: error
